name: Meta Ads - diagnose token (one-off)

# Run by hand (Actions > this workflow > Run workflow). Uses the META_ACCESS_TOKEN
# secret already stored in the repo to call the Graph API and prints what Meta
# answers - the token itself is never printed (masked). Nothing is written.
#
# 2026-10-21: added the "sync-shaped" variants (part B) after Meta started answering the
# sync's insights call with conversions but WITHOUT spend / impressions / clicks.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Call Graph API with the stored token
        env:
          TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          ACCOUNT: ${{ secrets.META_AD_ACCOUNT_ID }}
          API: v23.0
        run: |
          set +e
          if [ -z "$TOKEN" ]; then echo "META_ACCESS_TOKEN secret is EMPTY"; exit 1; fi
          echo "::add-mask::$TOKEN"
          ACT="$ACCOUNT"; case "$ACT" in act_*) ;; *) ACT="act_$ACT";; esac
          echo "Token length: ${#TOKEN} chars, ad account: $ACT"
          call () {
            echo; echo "=== $1"
            curl -sS "https://graph.facebook.com/$API/$2&access_token=$TOKEN" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          if "error" in d:
              e=d["error"]; print("ERROR code", e.get("code"), "subcode", e.get("error_subcode"), "type", e.get("type"))
              print("message:", e.get("message")); print("user_title:", e.get("error_user_title")); print("user_msg:", e.get("error_user_msg"))
          else:
              print(json.dumps(d, indent=1)[:1500])'
          }
          call "1. Who is this token (/me)"                      "me?fields=id,name"
          call "2. Ad account status"                            "$ACT?fields=name,account_status,disable_reason,timezone_name,currency"
          call "3. Insights yesterday (what the sync calls)"     "$ACT/insights?fields=spend,impressions&date_preset=yesterday"
          call "4. Token info (debug_token)"                     "debug_token?input_token=$TOKEN"
          echo; echo "Done. account_status 1 = active, 2 = disabled, 3 = unsettled, 7 = pending risk review, 9 = in grace period, 100 = pending closure, 101 = closed."

      - name: B. Sync-shaped insights calls (which shape loses spend?)
        env:
          TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          ACCOUNT: ${{ secrets.META_AD_ACCOUNT_ID }}
        run: |
          set +e
          echo "::add-mask::$TOKEN"
          ACT="$ACCOUNT"; case "$ACT" in act_*) ;; *) ACT="act_$ACT";; esac
          Y=$(date -u -d "yesterday" +%Y-%m-%d); S=$(date -u -d "45 days ago" +%Y-%m-%d); T=$(date -u +%Y-%m-%d)
          RANGE_1="{\"since\":\"$Y\",\"until\":\"$Y\"}"; RANGE_45="{\"since\":\"$S\",\"until\":\"$T\"}"
          F_FULL="date_start,date_stop,account_currency,spend,impressions,clicks,actions,action_values"
          F_NOACT="date_start,date_stop,account_currency,spend,impressions,clicks"
          F_MIN="date_start,spend,impressions"
          shape () {
            # $1 label, $2 api version, $3 fields, $4 time_range json, $5 extra query
            echo; echo "=== $1"
            curl -sS -G "https://graph.facebook.com/$2/$ACT/insights" --data-urlencode "access_token=$TOKEN" --data-urlencode "level=account" --data-urlencode "time_increment=1" --data-urlencode "fields=$3" --data-urlencode "time_range=$4" --data-urlencode "limit=100" $5 \
              -D /tmp/h.txt | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          if "error" in d:
              e=d["error"]; print("ERROR code", e.get("code"), "subcode", e.get("error_subcode"), "message:", e.get("message")); sys.exit(0)
          rows=d.get("data",[])
          with_spend=[r for r in rows if "spend" in r]; with_imp=[r for r in rows if "impressions" in r]; with_act=[r for r in rows if r.get("actions")]
          keys=sorted(set(k for r in rows for k in r))
          print("rows", len(rows), "| with spend", len(with_spend), "| with impressions", len(with_imp), "| with actions", len(with_act))
          print("keys seen:", keys)
          print("spend sum", round(sum(float(r.get("spend",0) or 0) for r in rows),2), "| first row:", json.dumps(rows[0])[:300] if rows else "-")'
            grep -i -E "^(x-fb-trace-id|x-ad-account-usage|x-business-use-case-usage|x-app-usage|facebook-api-version|x-fb-rev):" /tmp/h.txt | head -8
          }
          shape "B1 v23.0 (auto-upgraded) · 1 day · full fields (exactly what the sync sends)" v23.0 "$F_FULL" "$RANGE_1" ""
          shape "B2 v23.0 (auto-upgraded) · 45 days · full fields (the sync's rolling window)"  v23.0 "$F_FULL" "$RANGE_45" ""
          shape "B3 v25.0 explicit · 45 days · full fields"                                      v25.0 "$F_FULL" "$RANGE_45" ""
          shape "B4 v26.0 explicit · 45 days · full fields"                                      v26.0 "$F_FULL" "$RANGE_45" ""
          shape "B5 v25.0 · 45 days · no actions/action_values"                                 v25.0 "$F_NOACT" "$RANGE_45" ""
          shape "B6 v25.0 · 45 days · spend+impressions only"                                   v25.0 "$F_MIN" "$RANGE_45" ""
          shape "B7 v25.0 · 1 day · full fields"                                                 v25.0 "$F_FULL" "$RANGE_1" ""
          echo; echo "Done. A shape whose rows have spend is one the sync can use."

      - name: C. Campaign-level shapes (which field zeroes spend?)
        env:
          TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          ACCOUNT: ${{ secrets.META_AD_ACCOUNT_ID }}
        run: |
          set +e
          echo "::add-mask::$TOKEN"
          ACT="$ACCOUNT"; case "$ACT" in act_*) ;; *) ACT="act_$ACT";; esac
          S=$(date -u -d "45 days ago" +%Y-%m-%d); T=$(date -u +%Y-%m-%d); S7=$(date -u -d "7 days ago" +%Y-%m-%d)
          RANGE_45="{\"since\":\"$S\",\"until\":\"$T\"}"; RANGE_7="{\"since\":\"$S7\",\"until\":\"$T\"}"
          cshape () {
            echo; echo "=== $1"
            curl -sS -G "https://graph.facebook.com/v25.0/$ACT/insights" --data-urlencode "access_token=$TOKEN" --data-urlencode "level=campaign" --data-urlencode "time_increment=1" --data-urlencode "fields=$2" --data-urlencode "time_range=$3" --data-urlencode "limit=500" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          if "error" in d:
              e=d["error"]; print("ERROR code", e.get("code"), "subcode", e.get("error_subcode"), "message:", e.get("message")); sys.exit(0)
          rows=d.get("data",[])
          sp=sum(float(r.get("spend",0) or 0) for r in rows); imp=sum(int(r.get("impressions",0) or 0) for r in rows); nz=sum(1 for r in rows if float(r.get("spend",0) or 0)>0)
          print("rows", len(rows), "| rows with spend>0", nz, "| spend sum", round(sp,2), "| impressions", imp, "| keys:", sorted(set(k for r in rows for k in r)))'
          }
          cshape "C1 campaign · 45d · spend,impressions,clicks"                              "campaign_id,campaign_name,date_start,spend,impressions,clicks" "$RANGE_45"
          cshape "C2 campaign · 45d · + reach"                                                "campaign_id,campaign_name,date_start,spend,impressions,reach,clicks" "$RANGE_45"
          cshape "C3 campaign · 45d · + inline_link_clicks"                                   "campaign_id,campaign_name,date_start,spend,impressions,clicks,inline_link_clicks" "$RANGE_45"
          cshape "C4 campaign · 45d · + reach + inline_link_clicks (sync 2.5 delivery pass)"  "campaign_id,campaign_name,date_start,spend,impressions,reach,clicks,inline_link_clicks" "$RANGE_45"
          cshape "C5 campaign · 7d · + reach + inline_link_clicks"                            "campaign_id,campaign_name,date_start,spend,impressions,reach,clicks,inline_link_clicks" "$RANGE_7"
          cshape "C6 campaign · 45d · spend only"                                             "campaign_id,date_start,spend" "$RANGE_45"
          cshape "C7 campaign · 45d · spend,impressions,clicks,actions (old one-call)"       "campaign_id,campaign_name,date_start,spend,impressions,clicks,actions,action_values" "$RANGE_45"
          echo; echo "Done."
