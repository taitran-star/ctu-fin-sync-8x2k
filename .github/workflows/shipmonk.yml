name: Cattasaurus ShipMonk sync

on:
  schedule:
    # Every 30 minutes at :10 and :40 UTC - offset from Amazon (:00/:30), Shopify (:05/:35),
    # Meta (:15/:45), Google (:20/:50) and Amazon Ads (:25) so no two workflows push at once.
    - cron: "10,40 * * * *"
  workflow_dispatch:   # "Run workflow" by hand; fill the two dates to backfill history in chunks
    inputs:
      backfill_start:
        description: "Backfill from (YYYY-MM-DD). Leave empty for the normal rolling run."
        required: false
        default: ""
      backfill_end:
        description: "Backfill to (YYYY-MM-DD, inclusive). Empty = today."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: shipmonk-sync
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # a backfill chunk can take hours; rolling runs finish in minutes
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync to the latest main
        # A run queued behind another run (a backfill, or the 30-minute cron) is checked out at the
        # commit it was QUEUED on, so its copy of data/*.json can be older than what that run just
        # pushed. Fast-forward first so the history merge starts from the newest file.
        run: |
          git fetch --depth=1 origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ShipMonk fulfillment costs (per order, booked on the order date)
        env:
          # One calendar for the whole P&L: every source buckets its days in this timezone.
          REPORT_TIMEZONE: America/Los_Angeles
          # History: every run keeps the days it did not refetch, so the file grows into
          # 2025-01-01 -> today. A manual run with the two dates below backfills a past range.
          HISTORY_START: "2025-01-01"
          BACKFILL_START: ${{ github.event.inputs.backfill_start }}
          BACKFILL_END: ${{ github.event.inputs.backfill_end }}
          SHIPMONK_API_KEY: ${{ secrets.SHIPMONK_API_KEY }}
          # Optional overrides:
          # SHIPMONK_BASE_URL: https://api.shipmonk.com
          # SHIPMONK_STORE_IDS: "123,456"          # only these ShipMonk stores (default: all)
          # SHIPMONK_ORDER_TYPES: direct_to_consumer,amazon,retail
          # WINDOW_DAYS: 45
          # SHIPMONK_COST_BASIS: ordered          # "ordered" (default, matches revenue) or "shipped"
          # ORDERS_CSV_DIR: data/shipmonk_orders        # per-order detail, one CSV per month ("" to skip)
        run: |
          if [ -z "$SHIPMONK_API_KEY" ]; then
            echo "::notice::SHIPMONK_API_KEY secret not set yet - create it from ShipMonk > Account Settings > General Settings > Integration API Keys. Skipping."
            exit 0
          fi
          python fetch_shipmonk.py

      - name: Keep a copy of the fetched data as a run artifact (safety net if the push below fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipmonk-data-run-${{ github.run_number }}
          path: |
            data/shipmonk.json
            data/shipmonk_orders/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated data files if changed
        run: |
          git config user.name "cattasaurus-shipmonk-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/shipmonk.json ] && git add data/shipmonk.json
          [ -d data/shipmonk_orders ] && git add data/shipmonk_orders
          # v1.3+ writes one CSV per month under data/shipmonk_orders/; retire the old single
          # file from BOTH the index and the working tree. (Leaving it on disk untracked made
          # "git pull --rebase" refuse to check out main - "untracked working tree files would
          # be overwritten" - and the whole 2025 backfill was lost at the push.)
          git rm -qf --ignore-unmatch data/shipmonk_orders.csv
          rm -f data/shipmonk_orders.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update ShipMonk data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # Other workflows commit to the same repo; rebase-then-push with a few retries
          # so a concurrent push from them never fails this job.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            if git status --porcelain | grep -q '^UU\|^AA\|^DU\|^UD'; then
              # Same-file conflict: another run pushed this source's data while we ran (should not
              # happen - runs of one source are serialized and we synced before fetching). Keep
              # what is already on main; this run's window is simply refetched next cycle.
              echo "::warning::data conflict with a newer commit on main - keeping main's version, this run's fetch will be redone next cycle"
              git diff --name-only --diff-filter=U | while read -r f; do
                if git checkout --ours -- "$f" 2>/dev/null; then git add -- "$f"; else git rm -q --cached -- "$f"; fi
              done
              GIT_EDITOR=true git rebase --continue || git rebase --skip || git rebase --abort
              git push && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Could not push after 5 attempts." && exit 1
