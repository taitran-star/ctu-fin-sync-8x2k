name: Cattasaurus Shopify + Snowball sync

on:
  schedule:
    # Every 30 minutes at :05 and :35 UTC - offset from Amazon (:00/:30) and
    # Meta (:15/:45) so the three workflows never push to the repo at the same moment.
    - cron: "5,35 * * * *"
  workflow_dispatch:   # "Run workflow" by hand; fill the two dates to backfill history in chunks
    inputs:
      backfill_start:
        description: "Backfill from (YYYY-MM-DD). Leave empty for the normal rolling run."
        required: false
        default: ""
      backfill_end:
        description: "Backfill to (YYYY-MM-DD, inclusive). Empty = today."
        required: false
        default: ""
      reclassify:
        description: "true = only re-apply the channel rules to the stored journey records (no Shopify call, seconds)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: shopify-pnl-sync
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # a backfill chunk can take hours; rolling runs finish in minutes
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync to the latest main
        # A run queued behind another run (a backfill, or the 30-minute cron) is checked out at the
        # commit it was QUEUED on, so its copy of data/*.json can be older than what that run just
        # pushed. Fast-forward first so the history merge starts from the newest file.
        run: |
          git fetch --depth=1 origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Shopify orders + Snowball commissions
        env:
          # One calendar for the whole P&L: every source buckets its days in this timezone.
          REPORT_TIMEZONE: America/Los_Angeles
          # History: every run keeps the days it did not refetch, so the file grows into
          # 2025-01-01 -> today. A manual run with the two dates below backfills a past range.
          HISTORY_START: "2025-01-01"
          BACKFILL_START: ${{ github.event.inputs.backfill_start }}
          BACKFILL_END: ${{ github.event.inputs.backfill_end }}
          # Attribution (v1.9): raw journey signals per order are kept in data/shopify_journeys/YYYY-MM.json;
          # "reclassify" re-applies the channel rules to them without touching Shopify.
          RECLASSIFY_ONLY: ${{ github.event.inputs.reclassify }}
          # Landing pages only Google Ads use (Google auto-tagging is invisible in Shopify's journey data)
          GOOGLE_ADS_LANDING_PATHS: "/pages/cats-love-it-2025"
          GOOGLE_ADS_HANDLE_SUFFIX: "-gg"
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          # Snowball > Settings > Advanced > Revenue Calculation has BOTH
          # "include tax" and "include shipping" switched on for Cattasaurus,
          # so commissions are computed on the order total.
          SNOWBALL_COMMISSION_BASE: total
          # Commission rate per Snowball program (program name exactly as it
          # appears after "Referral - SS - " in the Shopify order tag).
          # Values are percentages. Programs missing here fall back to the
          # number in their name, then to SNOWBALL_DEFAULT_RATE (0) + a warning
          # in data/shopify_pnl.json -> meta.warnings.
          # Fallback only - rates are LEARNED from the Snowball conversions exports in
          # data/snowball_conversions/ (exact commission per order id). Verified from the
          # 18/08-17/09/2026 export: Peekaboo Affiliate 15 pays 20% (the "15" is the customer
          # discount), B1G2F_WEEKEND 30%, "Organic short content" pays a 10% discount code (no cash).
          SNOWBALL_PROGRAM_RATES: '{"Peekaboo Affiliate 15": 20, "30% Commision": 30, "B1G2F_WEEKEND": 30, "homebodycatclub_partner": 15, "15% CODE + 10% commission": 10, "Organic short content": 0, "THANKYOU20_CAMP": 0}'
          SNOWBALL_CONVERSIONS_DIR: data/snowball_conversions
          # Live feed: Google Sheet filled by Zapier (Social Snowball "New Conversion" ->
          # Google Sheets "Create Spreadsheet Row"), published as CSV. Stored as a repo
          # secret so the sheet link is not visible in this public repo. Optional - when
          # the secret is empty the script only reads the CSV files in the folder above.
          SNOWBALL_CONVERSIONS_URLS: ${{ secrets.SNOWBALL_CONVERSIONS_URLS }}
          # Optional overrides:
          # SHOPIFY_API_VERSION: 2026-07
          # WINDOW_DAYS: 45
          # PAGE_SIZE: 60
        run: python fetch_shopify_pnl.py

      - name: Commit updated data file if changed
        env:
          RECLASSIFY_NOTE: ${{ github.event.inputs.reclassify == 'true' && ' [reclassify]' || '' }}
        run: |
          git config user.name "cattasaurus-shopify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/shopify_pnl.json
          git add -A data/shopify_journeys 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Shopify + Snowball data ($(date -u +%Y-%m-%dT%H:%M:%SZ))${RECLASSIFY_NOTE}"
          # The Amazon and Meta workflows commit to the same repo; rebase-then-push
          # with a few retries so a concurrent push from them never fails this job.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            if git status --porcelain | grep -q '^UU\|^AA'; then
              # Same-file conflict: another run pushed this source's data while we ran (should not
              # happen - runs of one source are serialized and we synced before fetching). Keep
              # what is already on main; this run's window is simply refetched next cycle.
              echo "::warning::data conflict with a newer commit on main - keeping main's version, this run's fetch will be redone next cycle"
              git diff --name-only --diff-filter=U | xargs -r git checkout --ours -- && git diff --name-only --diff-filter=U | xargs -r git add -- && GIT_EDITOR=true git rebase --continue || git rebase --abort
              git push && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Could not push after 5 attempts." && exit 1
