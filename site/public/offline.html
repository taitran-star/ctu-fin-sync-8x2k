<title>Cattasaurus Dashboard — không có mạng</title>
<style>
  /* fonts:start — self-hosted (Libre Franklin + Fuzzy Bubbles are public files; Bureau Grot sits behind the password) */
  @font-face{font-family:'Bureau Grot Cond';font-weight:100 900;font-style:normal;font-display:swap;src:url(/fonts/BureauGrot-CondMedium.woff2) format('woff2');}
  @font-face{font-family:'Libre Franklin';font-weight:100 500;font-style:normal;font-display:swap;src:url(/fonts/LibreFranklin-Regular.woff2) format('woff2');}
  @font-face{font-family:'Libre Franklin';font-weight:600 900;font-style:normal;font-display:swap;src:url(/fonts/LibreFranklin-SemiBold.woff2) format('woff2');}
  @font-face{font-family:'Fuzzy Bubbles';font-weight:700;font-style:normal;font-display:swap;src:url(/fonts/FuzzyBubbles-Bold.woff2) format('woff2');}
  /* fonts:end */
  :root{color-scheme:light;--bg:#C9E595;--ink:#05372E;--forest:#285D18;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Libre Franklin',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px 16px;}
  .wm{display:block;height:54px;width:auto;margin:0 auto 12px;} .mascot{display:block;height:170px;width:auto;margin:0 auto;}
  .fun{font-family:'Fuzzy Bubbles','Comic Sans MS',cursive;font-size:19px;color:var(--forest);margin:8px 0 4px;}
  p{margin:0 0 16px;max-width:360px;font-weight:500;}
  button{font:inherit;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:12px 22px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);cursor:pointer;}
</style>
</head>
<body>
<div>
  <img class="wm" src="/img/logo-h-pine.png" alt="Cattasaurus" width="1000" height="327">
  <img class="mascot" src="/img/mascot-sleep.png" alt="" aria-hidden="true" width="720" height="437">
  <div class="fun">meow… mất mạng rồi</div>
  <p>Chưa có kết nối và máy này chưa lưu số liệu lần nào. Có mạng lại thì bấm thử lại.</p>
  <button type="button" onclick="location.reload()">Thử lại</button>
</div>
</body>
