name: Cattasaurus Amazon P&L sync

on:
  schedule:
    # Every 30 minutes (UTC). GitHub may delay a few minutes under load - that's fine.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write

concurrency:
  group: amazon-pnl-sync
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Amazon SP-API financial data
        env:
          AMAZON_SP_API_CLIENT_ID: ${{ secrets.AMAZON_SP_API_CLIENT_ID }}
          AMAZON_SP_API_CLIENT_SECRET: ${{ secrets.AMAZON_SP_API_CLIENT_SECRET }}
          AMAZON_SP_API_REFRESH_TOKEN: ${{ secrets.AMAZON_SP_API_REFRESH_TOKEN }}
        run: python fetch_amazon_pnl.py

      - name: Commit updated data file if changed
        run: |
          git config user.name "cattasaurus-amazon-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/amazon_pnl.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update Amazon P&L data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # The Meta and Shopify workflows commit to the same repo; rebase-then-push
          # with a few retries so a concurrent push from them never fails this job.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Could not push after 5 attempts." && exit 1
